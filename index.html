<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9F1F7">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>聖誕跨年大禮包－澳男請上鉤</title>
<meta name="description" content="2026/12/22–2027/1/2 伯斯＋雪梨｜行程、憑證、天氣與分帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 南半球夏日聖誕＋釣魚：海洋藍為底、聖誕紅為重點、別針金為點綴 */
  --bg:#E9F1F7; --surface:#FFFFFF; --surface-2:#E3ECF3; --ink:#13263A; --ink-2:#465A6E; --ink-3:#8496A8;
  --line:rgba(19,38,58,.1); --rust:#24557F; --rust-soft:#DCE8F2; --xmas:#C8414E; --sea:#2C6E9B; --sea-soft:#DCEAF4;
  --gum:#2E7D5B; --gum-soft:#DDEFE6; --night:#1D3A5C; --gmap:#2C6E9B; --rose:#C8414E; --rose-soft:#F8DEE1; --gold:#C9972E;
  --d1:#2C6E9B; --d2:#1D3A5C;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.75);
  --glass-edge:rgba(29,58,92,.08); --glass-hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25);
  --shadow:0 10px 30px rgba(29,58,92,.10),0 1px 2px rgba(19,38,58,.06);
  --blob-a:rgba(120,178,214,.55); --blob-b:rgba(200,65,78,.16); --blob-c:rgba(44,110,155,.28); --blob-d:rgba(46,125,91,.14);
  --r:20px; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:130px;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;position:relative;isolation:isolate;background:transparent}
body::before{content:"";position:fixed;inset:-10vmax;z-index:-2;pointer-events:none;background:
  radial-gradient(40vmax 34vmax at 6% 6%,var(--blob-a),transparent 70%),
  radial-gradient(36vmax 30vmax at 96% 10%,var(--blob-b),transparent 70%),
  radial-gradient(40vmax 34vmax at 90% 92%,var(--blob-c),transparent 70%),
  radial-gradient(36vmax 30vmax at 4% 90%,var(--blob-d),transparent 70%),
  linear-gradient(180deg,#F4F8FB 0%,var(--bg) 45%,#D6E7F2 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle,#fff 1.2px,transparent 1.6px),radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.4px);
  background-size:120px 140px,190px 170px;background-position:10px 20px,70px 90px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
a{color:var(--sea)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h2.sec{font-family:"Noto Serif TC",serif;font-size:22px;margin:0 0 4px;line-height:1.35}
h3.sub{font-size:16px;margin:24px 0 6px}
p.lead{color:var(--ink-2);margin:0 0 16px;font-size:14px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.42) 60%,rgba(255,255,255,.55));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-line);outline:1px solid var(--glass-edge);outline-offset:-1px;border-radius:var(--r);box-shadow:var(--glass-hi),var(--shadow)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--gum-soft);color:var(--gum);font-weight:700}
.chip.warn{background:var(--rose-soft);color:var(--rose);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
.btn.map{background:linear-gradient(160deg,#3A82B3,#235C85);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(44,110,155,.25)}
.btn.rust{background:linear-gradient(160deg,#3270A0,#1D4468);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(29,68,104,.25)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.danger{color:#A0606B;border-color:#E3C4C9}
.btn.danger.armed{background:#A0606B;color:#fff;border-color:#A0606B}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notice{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--rust-soft) 70%,transparent);font-size:14px;margin-top:14px}
.notice b{color:var(--rust)}
.box{padding:16px;margin-bottom:12px}
.box>b:first-child{display:block;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:14px;border-top:1px dashed var(--line);padding-top:12px}
.kv dt{color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0}
.tbd{color:var(--rose);font-weight:700}

/* hero / topbar / nav */
.hero{position:relative;overflow:hidden;background:linear-gradient(165deg,#12304F 0%,#1D4A72 55%,#3D7FA8 120%);color:#fff;padding:46px 0 48px}
.hero .sun{position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.9) 0%,rgba(255,214,150,.35) 40%,transparent 70%);opacity:.5}
.lights{position:absolute;left:0;right:0;top:0;height:40px;pointer-events:none}
.lights svg{width:100%;height:40px;display:block}
.hero svg.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:28px}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.06em;background:rgba(255,255,255,.16);padding:3px 11px;border-radius:999px}
.hero h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(30px,6vw,46px);line-height:1.18;margin:10px 0 8px}
.hero h1 em{font-style:normal;color:#FFD9A0}
.hero .subt{font-size:14px;opacity:.92;margin:0 0 14px;max-width:620px}
.count{display:inline-block;font-size:13px;background:rgba(0,0,0,.2);border-radius:12px;padding:4px 12px}
.count b{font-family:"Noto Serif TC",serif;font-size:22px;color:#FFD9A0;margin:0 2px}

.nav{position:sticky;top:0;z-index:100;background:rgba(233,241,247,.55);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 6px 20px rgba(29,58,92,.06)}
.topbar{display:none}
.navrow{display:flex;align-items:center;gap:8px}
.main{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;margin:8px 0 8px;max-width:760px;border-radius:24px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 #fff,0 6px 20px rgba(29,58,92,.08)}
.mt{border:0;background:transparent;border-radius:12px;padding:6px 2px;cursor:pointer;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:700;white-space:nowrap}
.mt svg{width:22px;height:22px}
.mt{border-radius:19px!important}
.mt[aria-selected="true"]{background:linear-gradient(160deg,#3270A0,#1D4468);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(29,68,104,.28)}
.me{flex:0 0 auto;margin-left:auto;min-width:42px;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--glass);cursor:pointer;font-weight:900;font-family:"Noto Serif TC",serif;font-size:17px;padding:0 10px;color:var(--rust)}
.me.none{font-family:"Noto Sans TC",sans-serif;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.subs{display:flex;gap:6px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none;max-width:760px}
.subs::-webkit-scrollbar{display:none}
.subs:empty{display:none}
.st{flex:1 0 auto;border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:5px 14px;font-size:14px;cursor:pointer;color:var(--ink-2)}
.st[aria-selected="true"]{border-color:rgba(36,85,127,.35);background:rgba(220,232,242,.85);color:var(--rust);font-weight:700;box-shadow:inset 0 1px 0 #fff}
.panel{display:none;padding:26px 0 56px}
.panel.on{display:block}
@media(max-width:859px){
  .hero{display:none}
  .topbar{display:flex;align-items:center;gap:8px;padding:8px 0 2px}
  .tb-title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:16px;line-height:1.3}
  .tb-title em{color:var(--xmas);font-style:normal}
  .tb-title{white-space:nowrap}
  @media(max-width:360px){.tb-long{display:none}}
  .tb-sub{font-size:12.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
  .topbar .me{width:auto;height:36px;min-width:36px;margin-left:6px}
  .navrow .me{display:none}
  .panel{padding-top:18px}
}
@media(min-width:860px){.m-only{display:none!important}}

/* today */
#todayBox{display:block}
@media(min-width:860px){#todayBox{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}#todayBox .td{margin:0}}
.td{padding:14px 16px;margin-bottom:10px}
.td.hi{border-color:color-mix(in srgb,var(--rust) 30%,transparent);background:color-mix(in srgb,var(--rust-soft) 60%,transparent)}
.td.sea{border-color:color-mix(in srgb,var(--sea) 50%,transparent);background:color-mix(in srgb,var(--sea-soft) 65%,transparent)}
.td-k{font-size:12.5px;color:var(--ink-3)}
.td-t{font-size:18px;font-weight:700;line-height:1.35;margin-top:2px}
.td-t.neg{color:var(--rose)} .td-t.pos{color:var(--gum)} .td-t.zero{color:var(--ink-2)}
.td-big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:36px;color:var(--rust);line-height:1.15}
.td-p{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.6}
.tdtitle{padding:16px 16px 14px;margin-bottom:10px;background:linear-gradient(165deg,rgba(18,48,79,.95),rgba(29,74,114,.92) 60%,rgba(61,127,168,.9) 130%)!important;color:#fff;border:0!important;outline:none!important;position:relative;overflow:hidden}
.tdtitle b{font-family:"Noto Serif TC",serif;font-size:21px;font-weight:900}
.tdtitle em{font-style:normal;color:#FFD9A0}
.tdtitle p{margin:6px 0 2px;font-size:13px;opacity:.92}

.later summary{cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.lrow:first-of-type{margin-top:8px}
.lrow small{display:block;color:var(--ink-3);font-size:12px}
.bar{flex:1;height:10px;background:color-mix(in srgb,var(--surface-2) 80%,transparent);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2E7D5B,#C9972E 60%,#C8414E);width:0;transition:width .3s}

/* weather */
.wxat{color:var(--ink-3);font-size:11.5px}
.wxrow{display:grid;grid-template-columns:70px 26px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.wxrow:last-of-type{border-bottom:0}
.wxrow b{font-size:13.5px;line-height:1.2}
.wxrow b small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.wxrow svg{width:24px;height:24px}
.wxrow .wxna{grid-column:2/-1;color:var(--ink-3);font-size:12.5px}
.wxt{font-weight:700;font-variant-numeric:tabular-nums}
.wxp{color:var(--sea);font-size:12px;min-width:52px;text-align:right}
.wxnorm{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--surface-2) 60%,transparent);font-size:12.5px;color:var(--ink-2)}
.wxnorm svg{width:22px;height:22px;flex:0 0 auto}
.wxtoday{display:flex;gap:12px;align-items:center;margin-top:4px}
.wxtoday svg{width:44px;height:44px}
.wxwarn{margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--sea-soft) 70%,transparent);color:var(--sea);font-weight:700;font-size:13.5px}
.wxhours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;text-align:center}
.wxhours div{background:color-mix(in srgb,var(--surface-2) 60%,transparent);border-radius:10px;padding:6px 2px}
.wxhours small{display:block;font-size:11px;color:var(--ink-3)}
.wxhours svg{width:24px;height:24px;display:block;margin:2px auto}
.wxhours b{font-size:14px}

/* flights */
.grid2{display:block}
@media(min-width:860px){.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.grid2>*{margin:0!important}}
.pass{overflow:hidden;margin-bottom:14px}
.pass .top{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:14px}
.pass .body{padding:16px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px}
.route .code{font-family:"Noto Serif TC",serif;font-size:28px;font-weight:900;line-height:1}
.route .time{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.route small{font-size:12px;color:var(--ink-3);display:block;line-height:1.4}
.route .r{text-align:right}
.route .mid{text-align:center;color:var(--ink-3);font-size:11.5px;padding-bottom:22px}
.route .mid .ln{width:56px;height:2px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 5px,transparent 5px 9px);margin:4px auto}
.stay .when{font-size:12.5px;color:var(--ink-3)}
.stay h3{margin:2px 0 4px;font-size:17px}
.pl{font-size:13.5px;color:var(--ink-2);display:flex;gap:4px;align-items:flex-start}
.pl svg{width:14px;height:14px;margin-top:3px;flex:0 0 auto;color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 40px;font-size:14.5px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--sea);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;border-left:2px dashed var(--line)}
.steps li:last-child::after{display:none}
.steps b{display:block}
.steps small{color:var(--ink-2);font-size:13.5px}
.lic{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lic div{background:color-mix(in srgb,var(--surface-2) 60%,transparent);border-radius:12px;padding:10px 6px;text-align:center;font-size:13px;font-weight:700}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.06em;color:var(--rust)}
.bigcode{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:28px;letter-spacing:.12em;color:var(--rust);line-height:1.2}
.bagt{width:100%;border-collapse:collapse;font-size:13.5px}
.bagt th,.bagt td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.bagt th{font-size:12px;color:var(--ink-3);font-weight:500}
.bagt td b{font-size:15px}
.bagt small{display:block;color:var(--ink-3);font-size:11.5px}
.vch .tip{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.vch{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin-bottom:8px}
.vch .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--sea-soft) 80%,transparent);color:var(--sea)}
.vch .ic svg{width:20px;height:20px}
.vch.miss .ic{background:color-mix(in srgb,var(--rose-soft) 80%,transparent);color:var(--rose)}
.vch b{display:block;font-size:15px;line-height:1.35}
.vch small{color:var(--ink-3);font-size:12.5px}

/* timeline */
.tlhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.days::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;min-width:66px;border:1px solid var(--glass-line);background:var(--glass);border-radius:14px;padding:6px 6px;cursor:pointer;text-align:center;line-height:1.3}
.daybtn b{display:block;font-size:15px}
.daybtn small{color:var(--ink-3);font-size:12px}
.daybtn[aria-pressed="true"]{background:var(--dc);border-color:var(--dc);color:#fff}
.daybtn[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.daybtn.today::after{content:"今天";display:block;font-size:10.5px;font-weight:700;color:var(--rust)}
.daybtn.today[aria-pressed="true"]::after{color:#FFD9A0}
.daytheme{margin:0 0 14px;font-size:14px;color:var(--ink-2);padding:10px 14px;border-left:4px solid var(--dc);background:var(--glass);border-radius:0 12px 12px 0}
#p-play-plan{max-width:760px}
.stop{padding:14px 16px;position:relative;overflow:hidden}
.stop::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc)}
.stop .sh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stop .time{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;color:var(--dc);font-variant-numeric:tabular-nums;line-height:1.2;margin-right:2px}
.stop h3{font-size:16.5px;margin:4px 0 2px;line-height:1.4}
.stop .note{margin:10px 0 0;font-size:14.5px;white-space:pre-line;word-break:break-word}
.stop .rmk{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--rust-soft) 70%,transparent);font-size:14px;white-space:pre-line}
.stop .rmk b{color:var(--rust)}
.stop.flight{background:color-mix(in srgb,var(--sea-soft) 65%,transparent)}
.opts{margin-top:10px;border:1.5px dashed color-mix(in srgb,var(--rust) 55%,transparent);border-radius:12px;padding:8px 12px}
.opts .oh{font-size:12.5px;font-weight:700;color:var(--rust);margin-bottom:2px}
.opt{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.opt:first-of-type{border-top:0}
.opt>span{flex:1;min-width:0}
.opt.pick{font-weight:700}
.opt.pick>span::before{content:"✓ ";color:var(--gum)}
.opt.dim{opacity:.55}
.opt a,.opt button{flex:0 0 auto;font-size:12.5px;border:1px solid var(--line);background:var(--glass);border-radius:8px;padding:2px 8px;text-decoration:none;color:var(--ink);cursor:pointer}
.mv{display:flex;gap:10px;padding:0 0 0 22px;font-size:13px;color:var(--ink-3);min-height:28px}
.mv .ln{border-left:2px dashed var(--line)}
.mv .tx{padding:6px 0}
.mv .tx b{color:var(--ink-2);font-weight:500}
.gap{height:10px}
.edbar{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.edbar button{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.mv .edbar{margin-top:4px;justify-content:flex-start}
.ins{display:block;width:100%;margin:8px 0;padding:8px;border:1.5px dashed var(--rust);background:transparent;color:var(--rust);border-radius:12px;font-size:13.5px;cursor:pointer}
.nowline{position:relative;height:0;border-top:2px solid var(--xmas);margin:16px 0}
.nowline span{position:absolute;left:0;top:-12px;background:var(--xmas);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.stop.past,.mv.past{opacity:.42}
.stop.cur{box-shadow:0 0 0 2px var(--rust),var(--shadow)}
.msg{font-size:13.5px;color:#A0606B;min-height:0;margin:0 0 8px}
.msg:empty{display:none}

/* map */

const avSrc=m=>AV_PIN[m];
const AV=(m,cls)=>AV_PIN[m]?`<img class="av-img${cls?" "+cls:""}" src="${AV_PIN[m]}" alt="${m}" draggable="false">`:"";
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), b64e=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s);};
async function aesDec(raw,iv,ct){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv},k,ct));}
async function unwrapKey(m,pw){
  const w=VAULT.keys[m],base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const kek=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(w.s),iterations:VAULT.iter,hash:"SHA-256"},base,256);
  return aesDec(kek,b64d(w.i),b64d(w.c));
}
async function bootApp(m,key){
  let js;
  if(VAULT){const o=JSON.parse(new TextDecoder().decode(await aesDec(key,b64d(VAULT.iv),b64d(VAULT.ct))));document.getElementById("app").innerHTML=o.html;js=o.js;}
  else js=document.getElementById("appjs").textContent;
  window.__ME=m;
  const sc=document.createElement("script");sc.textContent=js;document.body.appendChild(sc);
}
window.__logout=()=>{try{localStorage.removeItem(KEYSTORE)}catch(e){}location.href=location.pathname;};
let lgSel=null,fishRaf=0;
const lg=id=>document.getElementById(id);
function showLogin(){
  document.documentElement.classList.add("locked");lg("login").classList.add("on");
  lg("lgHint").innerHTML=PW_HINT+(VAULT?"":"<br><b>（開發版：任何密碼都可以）</b>");
  const li=document.querySelector(".hero .lights");if(li)lg("lgLights").innerHTML=li.innerHTML;
  startFish();
}
/* 釣別針：拖動磁鐵靠近別針就會吸住、捲上來 */
function startFish(){
  cancelAnimationFrame(fishRaf);lgSel=null;
  lg("lgFish").style.display="";lg("lgCaught").classList.remove("on");lg("lgErr").textContent="";
  const pond=lg("pond"),mag=lg("mag"),path=lg("lgPath"),box=lg("lgPins");
  const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const order=LG_MEMBERS.slice().sort(()=>Math.random()-.5);
  const pins=order.map((m,i)=>({m,ph:Math.random()*6.28,sp:.45+Math.random()*.35,bx:(i+.5)/order.length,by:i%2?.74:.6,x:0,y:0,r:0}));
  box.innerHTML=pins.map(p=>`<button class="fpin" type="button" data-m="${p.m}" aria-label="釣 ${p.m}（${AV_SVG[p.m].animal}）"><img src="${AV_PIN[p.m]}" alt="" draggable="false"></button>`).join("");
  const W=()=>pond.clientWidth,H=()=>pond.clientHeight;
  const st={mode:"free",mx:W()/2,my:64,tx:W()/2,ty:64,auto:null,hook:null,drag:false,t0:0,vx:0};
  pins.forEach(p=>{p.el=box.querySelector(`[data-m="${p.m}"]`);p.el.onpointerdown=e=>e.stopPropagation();p.el.onclick=e=>{e.stopPropagation();if(st.mode==="free")st.auto=p;};});
  const setT=e=>{const r=pond.getBoundingClientRect();st.auto=null;st.tx=Math.max(24,Math.min(r.width-24,e.clientX-r.left));st.ty=Math.max(10,Math.min(r.height-40,e.clientY-r.top-34));};
  pond.onpointerdown=e=>{if(st.mode!=="free")return;st.drag=true;pond.classList.add("drag");try{pond.setPointerCapture(e.pointerId)}catch(_){}setT(e);};
  pond.onpointermove=e=>{if(st.drag&&st.mode==="free")setT(e);};
  pond.onpointerup=pond.onpointercancel=()=>{st.drag=false;pond.classList.remove("drag");};
  const spark=(x,y)=>{for(let i=0;i<10;i++){const d=document.createElement("i");d.className="spark";const a=i/10*6.28;d.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*44}px;--dy:${Math.sin(a)*44}px`;pond.appendChild(d);setTimeout(()=>d.remove(),650);}};
  const loop=t=>{
    const w=W(),h=H(),sz=w<380?70:78;
    pins.forEach(p=>{if(p===st.hook)return;const k=RM?p.ph:t/1000*p.sp+p.ph;p.x=w*p.bx+Math.min(18,w*.04)*Math.sin(k);p.y=h*p.by+6*Math.sin(k*1.7);p.r=7*Math.sin(k*1.3);});
    if(st.mode==="free"){
      if(st.auto){st.tx=st.auto.x;st.ty=st.auto.y-44;}
      const nx=st.mx+(st.tx-st.mx)*.22;st.vx=nx-st.mx;st.mx=nx;st.my+=(st.ty-st.my)*.22;
      const cx=st.mx,cy=st.my+40;let near=null,nd=1e9;
      pins.forEach(p=>{const d=Math.hypot(p.x-cx,p.y-cy);if(d<nd){nd=d;near=p;}});
      mag.classList.toggle("near",nd<sz);
      if(nd<sz*.45){st.mode="reel";st.hook=near;st.x0=st.mx;st.y0=st.my;st.t0=t;near.el.classList.add("hooked");spark(near.x,near.y);try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}}
    }else{
      const e=Math.min(1,(t-st.t0)/(RM?200:950)),k=e<.15?0:(e-.15)/.85,ease=k*k*(3-2*k);
      st.mx=st.x0+(w/2-st.x0)*ease;st.my=st.y0+(-150-st.y0)*ease;st.vx=0;
      const p=st.hook;p.x=st.mx;p.y=st.my+40+sz*.42;p.r=4*Math.sin(t/90);
      if(e>=1){caught(p.m);return;}
    }
    mag.style.transform=`translate(${st.mx}px,${st.my}px) rotate(${Math.max(-18,Math.min(18,-st.vx*2))}deg)`;
    pins.forEach(p=>{p.el.style.width=p.el.style.height=sz+"px";p.el.style.margin=`${-sz/2}px 0 0 ${-sz/2}px`;p.el.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.r}deg)`;});
    const x0=w/2,cxq=(x0+st.mx)/2,cyq=Math.max(st.my*.55,0)+18;
    path.setAttribute("d",`M${x0} 0 Q${cxq} ${cyq} ${st.mx} ${st.my-4}`);
    fishRaf=requestAnimationFrame(loop);
  };
  fishRaf=requestAnimationFrame(loop);
}
function caught(m){
  cancelAnimationFrame(fishRaf);lgSel=m;lg("lgFish").style.display="none";
  lg("lgWho").innerHTML=`<img src="${AV_PIN[m]}" alt=""><span><b>釣到 ${m} 了！</b><small>${AV_SVG[m].animal}・輸入你的密碼</small></span>`;
  lg("lgCaught").classList.add("on");lg("lgIn").value="";lg("lgErr").textContent="";setTimeout(()=>lg("lgIn").focus(),50);
}
async function tryLogin(){
  if(!lgSel)return;const v=lg("lgIn").value.trim(),btn=lg("lgGo");
  if(!v){lg("lgErr").textContent="請輸入密碼";return;}
  btn.disabled=true;btn.textContent="解鎖中…";
  let key=null;
  try{if(VAULT)key=await unwrapKey(lgSel,v);}
  catch(e){lg("lgErr").textContent=window.crypto&&crypto.subtle?"密碼不對，再試一次":"這個瀏覽器不支援解鎖，請用 Safari 或 Chrome 開";btn.disabled=false;btn.textContent="進入";lg("lgIn").select();return;}
  try{localStorage.setItem(KEYSTORE,JSON.stringify({m:lgSel,k:key?b64e(key):""}))}catch(e){}
  lg("login").classList.remove("on");document.documentElement.classList.remove("locked");
  await bootApp(lgSel,key);
}
lg("lgGo").onclick=tryLogin;
lg("lgBack").onclick=startFish;
lg("lgIn").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
const lgStart=async()=>{
  let r=null;try{r=JSON.parse(localStorage.getItem(KEYSTORE)||"null")}catch(e){}
  if(r&&LG_MEMBERS.includes(r.m)){try{await bootApp(r.m,VAULT?b64d(r.k):null);return;}catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}}
  showLogin();
};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",lgStart);else lgStart();
</script>
</body>
